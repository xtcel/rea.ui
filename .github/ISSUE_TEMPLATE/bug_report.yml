name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what actually happened.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Press ...
        3. See ...
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Desktop app (macOS)
        - Web app / online demo
        - CLI (@xtcel/reaui-cli)
        - Editor canvas
        - AI generation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "reaui --version output, or the app version"
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Console output, `reaui validate --json`, or a screenshot.
      render: shell
    validations:
      required: false
