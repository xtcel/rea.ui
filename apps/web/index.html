<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="REA UI is an open-source design editor whose design source is React TSX + Tailwind. Edit AI-generated UI on a canvas and export production code." />
    <title>REA UI · Design workspace</title>
    <script>
      // Paint the stored theme before the first frame so a dark session never flashes white.
      try {
        var stored = localStorage.getItem('rea-theme');
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#15171a');
      } catch (error) { /* Storage or matchMedia unavailable: the light theme still renders. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
